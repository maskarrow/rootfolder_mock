# Deploy. Started by hand from the Actions tab, or by pushing a version tag (v*):
# `git tag v1.0.0 && git push origin v1.0.0` deploys that commit.
#
# 0. verify: resolves the chosen ref (the button's input, or the pushed tag) to one
#    commit, and refuses it unless it is on main. Every later job uses that commit,
#    so a push to main during the deploy cannot slip a different, untested commit
#    in, and a tag on some other branch is turned away. Then the CI checks (ci.yml:
#    tests, lint, build, secrets, known vulnerabilities) run on it.
# 1. build: on an ARM runner (the server is a Hetzner CAX, ARM), builds the api and
#    web images for the chosen commit, tagged `sha-<commit>`, and pushes them to
#    GHCR. Images that already exist for that commit are reused, not rebuilt.
# 2. deploy: connects to the server over SSH as `deploy`, whose key can only run
#    scripts/deploy.sh, and passes the two images pinned by digest. The script's
#    output appears in this job's log.
# 3. scan (beside deploy, report only): lists the known vulnerabilities in the
#    images, with a token that can only read packages.
#
# To go back to an older release, deploy its commit: it is on main, its images
# already exist, and the server keeps the database as it is. If GitHub itself is
# down, deploy.log on the server lists the images of every release, for running
# scripts/deploy.sh by hand.
#
# Secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST          the server's IPv4
#   DEPLOY_SSH_KEY       the private half of the CI key (the public half is in
#                        /home/deploy/.ssh/authorized_keys)
#   DEPLOY_KNOWN_HOSTS   the server's host key line, from your own known_hosts
name: Deploy

on:
  # A version tag deploys the commit it points at:
  #   git tag v1.2.3 && git push origin v1.2.3
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main
      dry_run:
        description: Dry run (pull the images on the server, change nothing)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time; a second one waits instead of cancelling the first.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/maskarrow/rootfolder-mock

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The button's input, or the pushed tag when there is no input.
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: The commit is on main
        id: resolve
        run: |
          sha="$(git rev-parse HEAD)"
          # Fetch main explicitly: a tag checkout does not set up origin/main on its
          # own, so FETCH_HEAD is how both triggers compare against main's tip.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" FETCH_HEAD; then
            echo "::error::${sha:0:7} is not on main. Merge it into main first; only main is deployed."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit: \`$sha\` ($(git log -1 --format=%s "$sha"))" >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.verify.outputs.sha }}

  build:
    needs: [verify, ci]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      api: ${{ steps.refs.outputs.api }}
      web: ${{ steps.refs.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Version
        id: version
        run: echo "version=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Images already built for this commit
        id: exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in api web; do
            if docker buildx imagetools inspect "$IMAGE_PREFIX-$image:$VERSION" >/dev/null 2>&1; then
              echo "$image=true" >> "$GITHUB_OUTPUT"
            else
              echo "$image=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Build the api image
        if: steps.exists.outputs.api == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.version }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the web image
        if: steps.exists.outputs.web == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.version }}
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Digests
        id: refs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in api web; do
            digest="$(docker buildx imagetools inspect "$IMAGE_PREFIX-$image:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$image=$IMAGE_PREFIX-$image@$digest" >> "$GITHUB_OUTPUT"
            echo "- $image: \`$IMAGE_PREFIX-$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  scan:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Read only: the scanner is a third-party image and gets this job's token.
    permissions:
      packages: read
    steps:
      - name: Known vulnerabilities in the images (trivy, report only)
        # A finding marks this step and does not stop the deploy: most come from the
        # base images, and the fix is the next Dependabot update, not a blocked
        # release. Our own dependencies are checked, and do block, in ci.yml.
        continue-on-error: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          API_IMAGE: ${{ needs.build.outputs.api }}
          WEB_IMAGE: ${{ needs.build.outputs.web }}
        run: |
          set -o pipefail
          status=0
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            echo "### $image" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --format table "$image" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          API_IMAGE: ${{ needs.build.outputs.api }}
          WEB_IMAGE: ${{ needs.build.outputs.web }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's own key, checked: never StrictHostKeyChecking=no.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # `--`: ssh also parses options after the host, and the command may start
          # with `--dry-run`. The server's forced command receives the rest as text.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$HOST" -- "$DRY_RUN $API_IMAGE $WEB_IMAGE"
          echo "Deployed ${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
