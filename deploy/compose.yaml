# The stack on the server: db, api, web, nginx, and certbot on demand.
#
# Lives in /opt/rootfolder next to:
#   .env                   secrets and settings (from .env.example), chmod 640
#   compose.override.yaml  the exact api and web images, written by deploy.sh
#   certbot/               certificates and the ACME challenge folder
#   backups/               database dumps taken before each deploy
#
# Day-to-day commands, from /opt/rootfolder:
#   docker compose ps
#   docker compose logs -f api
#   docker compose run --rm api python create_user.py <email> "<Name>" --org <Org> --admin

# Project name: containers and volumes are `rootfolder-mock-...`, whatever the
# folder. `docker compose down -v` removes exactly this app's data.
name: rootfolder-mock

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Docker's default 64 MB of shared memory can fail a parallel HNSW index build.
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [internal]
    mem_limit: 3g

  api:
    # The tag here is a placeholder: compose.override.yaml, written by deploy.sh,
    # pins the exact image by digest.
    image: ghcr.io/maskarrow/rootfolder-mock-api
    # An explicit list, not `env_file: .env`: the api must not receive the database
    # owner's password. It connects as APP_DB_USER, which may only read and write
    # rows (deploy/scripts/migrate.py creates it).
    environment:
      DATABASE_URL: postgresql+psycopg://${APP_DB_USER:?}:${APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB}
      APP_ENV: ${APP_ENV:-prod}
      APP_URL: ${APP_URL:?}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      API_KEYS_ENCRYPTION_KEY: ${API_KEYS_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Rootfolder Mock <onboarding@resend.dev>}
      JOB_SECONDS: ${JOB_SECONDS:-30}
      # Absolute: in the image the project root is `/`, and a relative path would
      # point where the non-root user cannot write.
      STORAGE_DIR: /data/storage
      # uvicorn trusts X-Forwarded-For / -Proto only from nginx, on this network.
      FORWARDED_ALLOW_IPS: 172.30.0.0/24
    volumes:
      - ${STORAGE_HOST_DIR:?}:/data/storage
    depends_on:
      db:
        condition: service_healthy
    # Docker kills a container 10 s after asking it to stop; uvicorn needs up to 30.
    stop_grace_period: 40s
    restart: unless-stopped
    networks: [internal]
    mem_limit: 1536m
    # No Linux capabilities, no privilege gain, a cap on processes: code that went
    # wrong (or was made to) can do little beyond what the app user already can.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  # Migrations and the app role's grants, as the database owner. Never left running:
  # deploy.sh starts it once per deploy (`docker compose run --rm migrate ...`).
  migrate:
    image: ghcr.io/maskarrow/rootfolder-mock-api
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    networks: [internal]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    image: ghcr.io/maskarrow/rootfolder-mock-web
    environment:
      # Read when the server starts: the same image works with any value.
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks: [internal]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?}
    volumes:
      # `bootstrap` (port 80 only, for the first certificate) or `app`. The nginx
      # image turns *.template into its config, filling in ${DOMAIN}.
      - ./nginx/${NGINX_CONFIG:-app}:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped
    networks: [internal]
    mem_limit: 256m

  certbot:
    image: certbot/certbot:latest
    # Only on demand: `docker compose run --rm certbot ...`.
    profiles: [certbot]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pgdata:

networks:
  internal:
    # Fixed, so FORWARDED_ALLOW_IPS above can name nginx's network; its own address
    # changes on every restart.
    ipam:
      config:
        - subnet: 172.30.0.0/24
